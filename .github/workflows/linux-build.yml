name: Linux build and regression
on:
  push:
    branches: [verification/date-calculator, bounty/date-calculator]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valac gcc gettext itstool libgtk-3-dev libgtk-3-bin libgtksourceview-4-dev libmpc-dev libmpfr-dev libsoup2.4-dev libxml2-dev libgee-0.8-dev libhandy-1-dev meson ninja-build libgirepository1.0-dev xvfb dbus-x11
      - name: Build complete application
        run: |
          meson setup _build -Dui-tests=true
          meson compile -C _build
      - name: Run regression suite
        run: xvfb-run -a dbus-run-session -- meson test -C _build --print-errorlogs
